<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WebAR Artwork Experience</title>

    <!-- Safe Camera Fallback for Laptops/Desktops without Rear Camera -->
    <script>
      (function() {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const originalGUM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
          navigator.mediaDevices.getUserMedia = async function(constraints) {
            try {
              return await originalGUM(constraints);
            } catch (err) {
              console.warn('[AR Camera] Primary constraint failed, attempting generic video fallback:', err);
              return await originalGUM({ audio: false, video: true });
            }
          };
        }
      })();
    </script>

    <!-- A-Frame 1.4.2 (Officially paired & tested with MindAR 1.2.5) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR Image Tracking for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000 !important;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      }

      /* Hide default A-Frame VR buttons and standard MindAR default UI */
      .a-enter-vr, .a-enter-ar { display: none !important; }
      .mindar-ui-overlay { display: none !important; }
      .mindar-ui-loading { display: none !important; }
      .mindar-ui-scanning { display: none !important; }

      /* Never show raw HTML video tags inside a-assets in the DOM */
      a-assets video, video[id^="artwork-video"] {
        display: none !important;
      }

      /* MindAR Camera Feed styling */
      body > video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        z-index: 0 !important;
      }

      /* Transparent A-Frame Canvas sitting directly over camera video */
      a-scene canvas.a-canvas {
        background: transparent !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 1 !important;
      }

      /* Fullscreen Loading & Permission Shield */
      #ar-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        color: #fff;
        padding: 24px;
        text-align: center;
        transition: opacity 0.4s ease-out, visibility 0.4s;
      }

      #ar-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .spinner-ring {
        width: 56px;
        height: 56px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ffffff;
        border-right-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loader-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #ffffff;
      }

      .loader-sub {
        font-size: 13px;
        color: #94a3b8;
        max-width: 320px;
        line-height: 1.5;
        margin-bottom: 16px;
      }

      .loader-badge {
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 6px 16px;
        color: #f1f5f9;
        margin-bottom: 16px;
      }

      .btn-start {
        background: #ffffff;
        color: #04121d;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 28px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .btn-start:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 25px rgba(255, 255, 255, 0.4);
      }

      .btn-new-tab {
        margin-top: 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid #334155;
        color: #94a3b8;
        font-size: 12px;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .btn-new-tab:hover {
        color: #e2e8f0;
        background: rgba(255, 255, 255, 0.12);
      }

      /* Minimal Viewfinder Reticle */
      #scanning-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.3s ease;
      }

      #scanning-hud.hidden {
        opacity: 0;
      }

      .hud-frame {
        position: relative;
        width: min(72vw, 290px);
        height: min(72vw, 290px);
        border: 1px dashed rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hud-corner {
        position: absolute;
        width: 22px;
        height: 22px;
        border-color: #007C94;
        border-style: solid;
      }
      .hud-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 8px; }
      .hud-tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-top-right-radius: 8px; }
      .hud-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-bottom-left-radius: 8px; }
      .hud-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 8px; }

      .hud-laser {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #23BFBC, transparent);
        box-shadow: 0 0 10px #23BFBC;
        animation: scanSweep 2.4s ease-in-out infinite alternate;
      }

      @keyframes scanSweep {
        0% { top: 8%; opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { top: 92%; opacity: 0.2; }
      }

      .hud-text {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: #f8fafc;
        background: rgba(15, 23, 42, 0.85);
        padding: 8px 18px;
        border-radius: 999px;
        margin-top: 24px;
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Audio Status Badge */
      #audio-badge {
        position: fixed;
        bottom: 24px;
        right: 20px;
        z-index: 1001;
        background: rgba(15, 23, 42, 0.88);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        backdrop-filter: blur(10px);
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #audio-badge:active {
        transform: scale(0.96);
      }

      /* Artwork Mode Selector Bar */
      #artwork-mode-bar {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1002;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(15, 23, 42, 0.88);
        padding: 5px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        max-width: 95vw;
        overflow-x: auto;
      }

      .mode-pill {
        border: none;
        background: transparent;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 700;
        padding: 7px 12px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        user-select: none;
      }

      .mode-pill.active {
        background: #007C94;
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(0, 124, 148, 0.6);
      }

      .mode-pill:hover:not(.active) {
        color: #f8fafc;
        background: rgba(255, 255, 255, 0.08);
      }

      .mode-pill:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <!-- Visual Loading Screen & Fallback Activator -->
    <div id="ar-loader">
      <div class="spinner-ring" id="loader-spinner"></div>
      <div class="loader-title" id="loader-title">Starting Camera</div>
      <div class="loader-sub" id="loader-sub">Initializing live camera stream & optical target features...</div>
      <div class="loader-badge" id="loader-status">Requesting Camera Access</div>
      <button class="btn-start" id="start-ar-btn" style="display: none;">
        <span>📷 Tap to Start Camera</span>
      </button>
      <a class="btn-new-tab" id="open-new-tab-btn" href="./standalone.html" target="_blank" rel="noopener noreferrer" style="display: none;">
        <span>↗ Open in New Window</span>
      </a>
    </div>

    <!-- Minimal Viewfinder Reticle HUD -->
    <div id="scanning-hud">
      <div class="hud-frame">
        <div class="hud-corner hud-tl"></div>
        <div class="hud-corner hud-tr"></div>
        <div class="hud-corner hud-bl"></div>
        <div class="hud-corner hud-br"></div>
        <div class="hud-laser"></div>
      </div>
      <div class="hud-text">
        <span style="font-size: 13px;">✦</span>
        <span>Align Artwork in Frame</span>
      </div>
    <!-- Artwork Target Selector Pill Bar -->
    <div id="artwork-mode-bar">
      <button type="button" class="mode-pill active" data-target="-1">✨ Auto All</button>
      <button type="button" class="mode-pill" data-target="0">💻 Art 1 (Laptop)</button>
      <button type="button" class="mode-pill" data-target="1">📺 Art 2 (TV)</button>
      <button type="button" class="mode-pill" data-target="2">🖥️ Art 3 (Desktop)</button>
    </div>

    <!-- Sound Toggle Button -->
    <div id="audio-badge">🔈 Sound Muted (Tap for Sound)</div>

    <!-- A-Frame WebAR Scene with MindAR Tracking -->
    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.02; warmupTolerance: 3; missTolerance: 6; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      style="position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1;"
    >
      <a-assets timeout="10000">
        <!-- Artwork 1 Video Overlay -->
        <video
          id="artwork-video"
          src="./assets/my-video.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          x5-playsinline
          muted
          crossorigin="anonymous"
        ></video>

        <!-- Artwork 2 Video Overlay -->
        <video
          id="artwork-video-2"
          src="./assets/my-video2.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          x5-playsinline
          muted
          crossorigin="anonymous"
        ></video>

        <!-- Artwork 3 Video Overlay -->
        <video
          id="artwork-video-3"
          src="./assets/my-video3.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          x5-playsinline
          muted
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Anchor 1: First Physical Artwork (targetIndex: 0) -->
      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
        <!-- Frame Border matching Artwork Ocean Teal (#007C94) -->
        <a-plane
          id="ar-video-border-1"
          position="0 0 -0.005"
          width="1.838"
          height="1.06"
          color="#007C94"
          visible="false"
          material="shader: flat; opacity: 0.95; transparent: true;"
        ></a-plane>

        <!-- Video Overlay Plane -->
        <a-video
          id="ar-video-plane"
          src="#artwork-video"
          position="0 0 0.002"
          height="1"
          width="1.778"
          rotation="0 0 0"
          visible="false"
          material="shader: flat; opacity: 0; transparent: true;"
        ></a-video>
      </a-entity>

      <!-- Target Anchor 2: Second Physical Artwork (targetIndex: 1) -->
      <a-entity id="target-anchor-2" mindar-image-target="targetIndex: 1">
        <!-- Frame Border matching Artwork Ocean Teal (#007C94) -->
        <a-plane
          id="ar-video-border-2"
          position="0 0 -0.005"
          width="1.838"
          height="1.06"
          color="#007C94"
          visible="false"
          material="shader: flat; opacity: 0.95; transparent: true;"
        ></a-plane>

        <!-- Video Overlay Plane -->
        <a-video
          id="ar-video-plane-2"
          src="#artwork-video-2"
          position="0 0 0.002"
          height="1"
          width="1.778"
          rotation="0 0 0"
          visible="false"
          material="shader: flat; opacity: 0; transparent: true;"
        ></a-video>
      </a-entity>

      <!-- Target Anchor 3: Third Physical Artwork (targetIndex: 2) -->
      <a-entity id="target-anchor-3" mindar-image-target="targetIndex: 2">
        <!-- Frame Border matching Artwork Ocean Teal (#007C94) -->
        <a-plane
          id="ar-video-border-3"
          position="0 0 -0.005"
          width="1.838"
          height="1.06"
          color="#007C94"
          visible="false"
          material="shader: flat; opacity: 0.95; transparent: true;"
        ></a-plane>

        <!-- Video Overlay Plane -->
        <a-video
          id="ar-video-plane-3"
          src="#artwork-video-3"
          position="0 0 0.002"
          height="1"
          width="1.778"
          rotation="0 0 0"
          visible="false"
          material="shader: flat; opacity: 0; transparent: true;"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video1 = document.getElementById('artwork-video');
      const targetAnchor1 = document.getElementById('target-anchor');
      const videoPlane1 = document.getElementById('ar-video-plane');
      const border1 = document.getElementById('ar-video-border-1');

      const video2 = document.getElementById('artwork-video-2');
      const targetAnchor2 = document.getElementById('target-anchor-2');
      const videoPlane2 = document.getElementById('ar-video-plane-2');
      const border2 = document.getElementById('ar-video-border-2');

      const video3 = document.getElementById('artwork-video-3');
      const targetAnchor3 = document.getElementById('target-anchor-3');
      const videoPlane3 = document.getElementById('ar-video-plane-3');
      const border3 = document.getElementById('ar-video-border-3');

      const loader = document.getElementById('ar-loader');
      const loaderStatus = document.getElementById('loader-status');
      const loaderTitle = document.getElementById('loader-title');
      const loaderSub = document.getElementById('loader-sub');
      const loaderSpinner = document.getElementById('loader-spinner');
      const startArBtn = document.getElementById('start-ar-btn');
      const openNewTabBtn = document.getElementById('open-new-tab-btn');

      const hud = document.getElementById('scanning-hud');
      const audioBadge = document.getElementById('audio-badge');
      const scene = document.querySelector('a-scene');

      // FRAME BORDER COLOR: Exact match to your physical artwork's Ocean Teal border (#007C94)
      const FRAME_BORDER_COLOR = '#007C94';

      // Auto-fit helper to match video aspect ratio cleanly with artwork frame border
      function setupVideoAutoFit(videoEl, planeEl, borderEl) {
        if (!videoEl || !planeEl) return;
        const setDims = () => {
          if (videoEl.videoWidth && videoEl.videoHeight) {
            const aspect = videoEl.videoWidth / videoEl.videoHeight;
            planeEl.setAttribute('width', aspect.toFixed(3));
            planeEl.setAttribute('height', '1');
            if (borderEl) {
              const borderPad = 0.06;
              borderEl.setAttribute('width', (aspect + borderPad).toFixed(3));
              borderEl.setAttribute('height', (1 + borderPad).toFixed(3));
              borderEl.setAttribute('color', FRAME_BORDER_COLOR);
            }
          }
        };

        videoEl.addEventListener('loadedmetadata', setDims);
        if (videoEl.readyState >= 1) setDims();
      }

      setupVideoAutoFit(video1, videoPlane1, border1);
      setupVideoAutoFit(video2, videoPlane2, border2);
      setupVideoAutoFit(video3, videoPlane3, border3);

      // Dismiss Loader when AR is ready
      let isReadyDismissed = false;
      function dismissLoader() {
        if (isReadyDismissed) return;
        isReadyDismissed = true;
        if (loaderStatus) loaderStatus.innerText = '✓ AR Engine Ready';
        if (loader) loader.classList.add('loaded');
      }

      // Check if inside an iframe without camera delegation
      const isIframe = window.self !== window.top;
      if (isIframe && openNewTabBtn) {
        openNewTabBtn.style.display = 'inline-flex';
      }

      // Show manual start button if camera takes > 2.2 seconds (e.g. awaiting permission or gesture)
      const loaderTimeout = setTimeout(() => {
        if (!isReadyDismissed) {
          if (loaderSpinner) loaderSpinner.style.display = 'none';
          if (loaderTitle) loaderTitle.innerText = 'Start Camera';
          if (loaderSub) loaderSub.innerText = 'Tap below to grant camera access and start the AR experience.';
          if (startArBtn) startArBtn.style.display = 'inline-flex';
        }
      }, 2200);

      // Handle user gesture start button
      startArBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        startArBtn.disabled = true;
        startArBtn.innerText = 'Starting...';

        // Pre-unlock video playback
        [video1, video2, video3].forEach(v => {
          if (v) {
            v.muted = true;
            v.play().then(() => v.pause()).catch(() => {});
          }
        });

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: "environment" } }
          });
          dismissLoader();
        } catch (err) {
          console.error('Camera request error:', err);
          if (loaderSub) loaderSub.innerText = 'Camera access was denied or unavailable. Please enable camera permissions in your browser.';
          if (openNewTabBtn) openNewTabBtn.style.display = 'inline-flex';
        }
      });

      // Bind AR readiness
      scene.addEventListener('arReady', () => {
        console.log('[AR Engine] arReady event fired!');
        clearTimeout(loaderTimeout);
        dismissLoader();
      });

      // Periodic check in case arReady fired before listener attached
      const readyPoller = setInterval(() => {
        const arSystem = scene ? scene.systems['mindar-image-system'] : null;
        if (arSystem && arSystem.controller) {
          clearInterval(readyPoller);
          clearTimeout(loaderTimeout);
          dismissLoader();
        }
      }, 300);

      // Handle arError
      scene.addEventListener('arError', (event) => {
        console.error('[AR Engine] arError event:', event);
        if (loaderSpinner) loaderSpinner.style.display = 'none';
        if (loaderTitle) loaderTitle.innerText = 'Camera Access Required';
        if (loaderSub) loaderSub.innerText = 'Camera stream could not start. Tap below to retry or launch in a direct browser tab.';
        if (startArBtn) {
          startArBtn.style.display = 'inline-flex';
          startArBtn.innerText = 'Retry Camera';
          startArBtn.disabled = false;
        }
        if (openNewTabBtn) openNewTabBtn.style.display = 'inline-flex';
      });

      // Centralized Target State Manager: Reliable Target Activation & Black Screen Prevention
      const targetVideos = [video1, video2, video3];
      const videoPlanes = [videoPlane1, videoPlane2, videoPlane3];
      const borders = [border1, border2, border3];

      let confirmedActiveTarget = null; // null | 0 | 1 | 2
      let currentFilterTarget = -1; // -1 = Auto all, 0 = Art 1, 1 = Art 2, 2 = Art 3

      // Start with all 3D planes hidden with 0 opacity
      videoPlanes.forEach(plane => {
        if (plane) {
          plane.setAttribute('visible', 'false');
          plane.setAttribute('material', 'shader: flat; opacity: 0; transparent: true;');
        }
      });
      borders.forEach(border => {
        if (border) border.setAttribute('visible', 'false');
      });

      // Reveal 3D plane ONLY after the video has decoded real frames and is actively rendering
      // This 100% prevents unbuffered black quads from covering the camera
      targetVideos.forEach((vid, idx) => {
        if (!vid) return;
        const plane = videoPlanes[idx];
        const border = borders[idx];

        const revealPlaneIfReady = () => {
          if (confirmedActiveTarget === idx && vid.currentTime > 0.03 && !vid.paused) {
            if (plane) {
              plane.setAttribute('visible', 'true');
              plane.setAttribute('material', 'shader: flat; opacity: 1; transparent: false;');
            }
            if (border) {
              border.setAttribute('visible', 'true');
            }
          }
        };

        vid.addEventListener('timeupdate', revealPlaneIfReady);
        vid.addEventListener('playing', revealPlaneIfReady);
      });

      function activateTarget(targetIndex) {
        if (confirmedActiveTarget === targetIndex) return;
        console.log(`[AR Engine] Activating Artwork ${targetIndex + 1}!`);
        confirmedActiveTarget = targetIndex;
        if (hud) hud.classList.add('hidden');

        targetVideos.forEach((vid, idx) => {
          if (!vid) return;
          if (idx === targetIndex) {
            vid.muted = isGlobalMuted;
            const playPromise = vid.play();
            if (playPromise !== undefined) {
              playPromise.catch((err) => {
                console.warn(`[AR Engine] Video ${idx + 1} play blocked by autoplay policy, retrying muted:`, err);
                vid.muted = true;
                vid.play().catch(e => console.error(`[AR Engine] Video ${idx + 1} playback error:`, e));
              });
            }
          } else {
            // Pause any other video (do NOT seek to 0 to preserve video hardware decoders)
            if (!vid.paused) vid.pause();
            if (videoPlanes[idx]) {
              videoPlanes[idx].setAttribute('visible', 'false');
              videoPlanes[idx].setAttribute('material', 'shader: flat; opacity: 0; transparent: true;');
            }
            if (borders[idx]) borders[idx].setAttribute('visible', 'false');
          }
        });
      }

      function handleTargetFound(targetIndex) {
        console.log(`[AR Engine] Target detected: Artwork ${targetIndex + 1} (targetIndex: ${targetIndex})`);
        // If user selected a specific target filter and this isn't it, ignore
        if (currentFilterTarget !== -1 && currentFilterTarget !== targetIndex) {
          return;
        }
        activateTarget(targetIndex);
      }

      function handleTargetLost(targetIndex) {
        console.log(`[AR Engine] Target lost: Artwork ${targetIndex + 1} (targetIndex: ${targetIndex})`);
        if (confirmedActiveTarget === targetIndex) {
          confirmedActiveTarget = null;
          const vid = targetVideos[targetIndex];
          if (vid && !vid.paused) {
            vid.pause();
          }
          if (videoPlanes[targetIndex]) {
            videoPlanes[targetIndex].setAttribute('visible', 'false');
            videoPlanes[targetIndex].setAttribute('material', 'shader: flat; opacity: 0; transparent: true;');
          }
          if (borders[targetIndex]) {
            borders[targetIndex].setAttribute('visible', 'false');
          }

          setTimeout(() => {
            if (confirmedActiveTarget === null && hud) {
              hud.classList.remove('hidden');
            }
          }, 250);
        }
      }

      // Bind Artwork 1 Events (targetIndex: 0 -> video 1)
      if (targetAnchor1) {
        targetAnchor1.addEventListener('targetFound', () => handleTargetFound(0));
        targetAnchor1.addEventListener('targetLost', () => handleTargetLost(0));
      }

      // Bind Artwork 2 Events (targetIndex: 1 -> video 2)
      if (targetAnchor2) {
        targetAnchor2.addEventListener('targetFound', () => handleTargetFound(1));
        targetAnchor2.addEventListener('targetLost', () => handleTargetLost(1));
      }

      // Bind Artwork 3 Events (targetIndex: 2 -> video 3)
      if (targetAnchor3) {
        targetAnchor3.addEventListener('targetFound', () => handleTargetFound(2));
        targetAnchor3.addEventListener('targetLost', () => handleTargetLost(2));
      }

      // Audio Toggle Controller
      let isGlobalMuted = true;
      function setMuteState(muted) {
        isGlobalMuted = muted;
        if (video1) video1.muted = muted;
        if (video2) video2.muted = muted;
        if (video3) video3.muted = muted;

        if (muted) {
          audioBadge.innerText = '🔈 Sound Muted (Tap for Sound)';
          audioBadge.style.borderColor = 'rgba(255, 255, 255, 0.2)';
        } else {
          audioBadge.innerText = '🔊 Sound On';
          audioBadge.style.borderColor = '#ffffff';
        }
      }

      audioBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        setMuteState(!isGlobalMuted);
      });

      // First user tap unlocks audio
      window.addEventListener('click', () => {
        if (isGlobalMuted) setMuteState(false);
      }, { once: true });

      // Artwork Mode Selector (Auto All vs Dedicated Target Focus)
      const modePills = document.querySelectorAll('.mode-pill');

      modePills.forEach(pill => {
        pill.addEventListener('click', (e) => {
          e.stopPropagation();
          const target = parseInt(pill.getAttribute('data-target'), 10);
          currentFilterTarget = target;

          modePills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');

          const arSystem = scene ? scene.systems['mindar-image-system'] : null;
          if (arSystem) {
            arSystem.switchTarget(target);
            console.log(`[AR Engine] Switched target filter to: ${target === -1 ? 'Auto All' : 'Artwork ' + (target + 1)}`);
          }

          // If filtering to a specific artwork, immediately pause any other video and hide planes
          if (target !== -1) {
            targetVideos.forEach((vid, idx) => {
              if (idx !== target) {
                if (vid && !vid.paused) vid.pause();
                if (videoPlanes[idx]) {
                  videoPlanes[idx].setAttribute('visible', 'false');
                  videoPlanes[idx].setAttribute('material', 'shader: flat; opacity: 0; transparent: true;');
                }
                if (borders[idx]) borders[idx].setAttribute('visible', 'false');
              }
            });
            if (confirmedActiveTarget !== target) {
              confirmedActiveTarget = null;
              if (hud) hud.classList.remove('hidden');
            }
          }
        });
      });
    </script>
  </body>
</html>
